<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 420"
     preserveAspectRatio="none">

    <defs>

        <!-- Main brand-purple paint -->
        <linearGradient id="mainPaint" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="#9D79F0" stop-opacity="0"/>
            <stop offset="5%" stop-color="#9D79F0" stop-opacity=".10"/>
            <stop offset="14%" stop-color="#9D79F0" stop-opacity=".23"/>
            <stop offset="32%" stop-color="#9D79F0" stop-opacity=".30"/>
            <stop offset="55%" stop-color="#9D79F0" stop-opacity=".28"/>
            <stop offset="76%" stop-color="#A98BF2" stop-opacity=".22"/>
            <stop offset="92%" stop-color="#9D79F0" stop-opacity=".10"/>
            <stop offset="100%" stop-color="#9D79F0" stop-opacity="0"/>
        </linearGradient>

        <!-- Lighter paint pass -->
        <linearGradient id="lightPaint" x1="0%" y1="50%" x2="100%" y2="50%">
            <stop offset="0%" stop-color="#C7B3F7" stop-opacity="0"/>
            <stop offset="12%" stop-color="#C7B3F7" stop-opacity=".12"/>
            <stop offset="45%" stop-color="#B99EF5" stop-opacity=".20"/>
            <stop offset="78%" stop-color="#C7B3F7" stop-opacity=".13"/>
            <stop offset="100%" stop-color="#C7B3F7" stop-opacity="0"/>
        </linearGradient>

        <!-- Softens the outside without blurring away the brush character -->
        <filter id="edgeSoft" x="-10%" y="-20%" width="120%" height="140%">
            <feGaussianBlur stdDeviation="2.8"/>
        </filter>

    </defs>


    <!--
        MAIN BRUSH BODY
        Uneven top/bottom boundaries instead of a rectangle/ribbon.
    -->
    <path
        d="
        M20 170

        C58 155 77 145 111 151
        C142 136 176 141 204 132
        C239 120 267 135 298 125
        C335 113 361 126 392 118
        C430 108 461 125 493 117
        C531 107 559 121 594 113
        C629 105 657 120 690 112
        C725 104 751 118 786 111
        C824 104 850 118 887 113
        C919 109 948 116 979 126

        L964 146
        L988 160
        L970 174
        L994 188
        L973 204
        L988 219
        L963 230
        L979 246

        C945 254 916 248 885 258
        C850 269 823 255 788 265
        C754 276 725 262 692 272
        C657 283 628 267 593 278
        C556 290 528 272 492 283
        C456 294 427 276 390 287
        C354 297 324 279 287 289
        C251 299 221 281 187 290
        C150 298 119 281 86 287

        L67 272
        L38 276
        L48 255
        L19 244
        L40 224
        L15 209
        L37 193
        Z"
        fill="url(#mainPaint)"
        filter="url(#edgeSoft)"
    />


    <!--
        SECOND PAINT PASS
        Slightly offset so the stroke has real depth rather than bands.
    -->
    <path
        d="
        M70 155

        C126 144 171 151 221 139
        C274 127 319 141 369 130
        C420 119 467 135 518 124
        C569 113 614 128 665 119
        C716 110 760 124 811 117
        C855 111 898 117 943 129

        C921 143 946 154 929 166
        C951 181 930 191 947 204
        C919 211 899 207 873 216

        C819 230 775 217 724 229
        C672 241 625 226 575 239
        C523 251 478 236 425 249
        C373 261 326 245 275 257
        C225 269 177 254 126 264
        C105 256 89 250 68 247

        C83 229 61 220 78 204
        C59 190 81 179 66 168
        Z"
        fill="url(#lightPaint)"
    />


    <!--
        DRY-BRUSH GAPS
        White translucent streaks cut visually through the paint.
    -->

    <path
        d="
        M90 184
        C189 170 275 181 365 166
        C456 151 545 169 637 155
        C731 141 818 158 916 147"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="11"
        stroke-linecap="round"
        opacity=".20"
    />

    <path
        d="
        M126 220
        C213 207 293 218 377 205
        C464 192 545 208 628 197
        C713 186 789 197 875 189"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="6"
        stroke-linecap="round"
        opacity=".17"
    />

    <path
        d="
        M180 250
        C264 240 338 247 417 236
        C501 225 575 239 654 228
        C731 218 798 226 852 220"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="3"
        stroke-linecap="round"
        opacity=".20"
    />


    <!--
        FINE BRISTLE MARKS
    -->

    <path
        d="M45 163 C148 145 234 157 330 140"
        fill="none"
        stroke="#7655C7"
        stroke-width="2"
        opacity=".12"
    />

    <path
        d="M640 278 C745 258 841 270 956 246"
        fill="none"
        stroke="#7655C7"
        stroke-width="2"
        opacity=".10"
    />

    <path
        d="M67 272 C145 260 205 271 274 259"
        fill="none"
        stroke="#9D79F0"
        stroke-width="1.5"
        opacity=".13"
    />


    <!--
        SMALL FEATHERED END STREAKS
        These prevent the left/right sides from looking vertically cut.
    -->

    <path
        d="M12 181 C46 174 65 170 103 164"
        fill="none"
        stroke="#9D79F0"
        stroke-width="7"
        stroke-linecap="round"
        opacity=".08"
    />

    <path
        d="M6 203 C41 198 62 192 96 188"
        fill="none"
        stroke="#9D79F0"
        stroke-width="4"
        stroke-linecap="round"
        opacity=".10"
    />

    <path
        d="M897 258 C934 251 958 245 995 237"
        fill="none"
        stroke="#9D79F0"
        stroke-width="6"
        stroke-linecap="round"
        opacity=".08"
    />

</svg>
